<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login - Tibia Online</title>
<link rel="stylesheet" href="css/style.css">
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js" defer></script>
<!-- Meus scripts -->
<script src="js/firebase.js" defer></script>
<script src="js/auth.js" defer></script>
</head>
<body>
<div class="container">
  <h1>Login</h1>
  <form id="formLogin">
    <input type="email" id="emailLogin" placeholder="Email" required><br>
    <input type="password" id="senhaLogin" placeholder="Senha" required><br>
    <button type="submit">Entrar</button>
  </form>
  <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  <p id="mensagem" class="mensagem"></p>
</div>
</body>
</html>
