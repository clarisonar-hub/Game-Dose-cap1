<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastro - Tibia Online</title>
</head>
<body>

<h1>Criar Conta - Tibia Online</h1>

<form>
  <label>Nome do Personagem:</label><br>
  <input type="text" placeholder="Nome do Personagem" required><br><br>

  <label>Email:</label><br>
  <input type="email" placeholder="Email" required><br><br>

  <label>Senha:</label><br>
  <input type="password" placeholder="Senha" required><br><br>

  <button type="submit">Cadastrar</button>
</form>

<p>Já tem conta? <a href="index.html">Login</a></p>

</body>
</html>
